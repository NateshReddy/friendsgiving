  const CLIP_MS = 5300;    // 5 seconds of music plus a little for Spotify to start
  const SONG_MS = 30000;   // "Play the song" after the reveal
  const SP_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");

  function spGet(k) { try { return JSON.parse(localStorage.getItem(k)) || null; } catch (e) { return null; } }
  function spSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage off */ } }
  function spAuth() { return spGet(SP_AUTH_KEY) || {}; }
  function spClientId() { return SPOTIFY_CLIENT_ID || spAuth().clientId || ""; }
  function spConnected() { const a = spAuth(); return !!(a.refresh || a.access); }
  function spErr(code, msg) { const e = new Error(msg); e.code = code; return e; }
  function b64url(bytes) { let s = ""; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function randomStr(n) {
    const cs = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
    const a = new Uint8Array(n); crypto.getRandomValues(a);
    return Array.from(a, x => cs[x % cs.length]).join("");
  }

  async function spLogin() {
    const id = spClientId();
    if (!id) { toast("Add the Spotify Client ID first"); return; }
    if (!(window.crypto && crypto.subtle)) { toast("This browser can't log in to Spotify"); return; }
    const verifier = randomStr(64);
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
    const state = randomStr(16);
    save();
    spSet(SP_PKCE_KEY, { verifier, state, clientId: id, mode: S && S.mode, screen: S && S.screen });
    const q = new URLSearchParams({ response_type: "code", client_id: id, scope: SP_SCOPES, code_challenge_method: "S256", code_challenge: challenge, redirect_uri: SP_REDIRECT, state });
    location.assign("https://accounts.spotify.com/authorize?" + q.toString());
  }
  // Back from Spotify's login page with ?code=... : trade it for tokens, then put the host back where they were.
  async function spHandleReturn() {
    const u = new URL(location.href);
    const code = u.searchParams.get("code"), err = u.searchParams.get("error"), state = u.searchParams.get("state");
    if (!code && !err) return null;
    history.replaceState(null, "", location.pathname + location.hash);
    const p = spGet(SP_PKCE_KEY);
    spSet(SP_PKCE_KEY, null);
    if (!p) return null;
    if (err || state !== p.state) return { p, msg: err === "access_denied" ? "Spotify login cancelled" : "Spotify login didn't work. Try again" };
    let r, j = {};
    try {
      r = await fetch("https://accounts.spotify.com/api/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ grant_type: "authorization_code", code, redirect_uri: SP_REDIRECT, client_id: p.clientId, code_verifier: p.verifier }) });
      j = await r.json().catch(() => ({}));
    } catch (e) { return { p, msg: "Can't reach Spotify. Check the wifi" }; }
    if (!r.ok || !j.access_token) return { p, msg: "Spotify login didn't work: " + (j.error_description || j.error || r.status) };
    spSet(SP_AUTH_KEY, Object.assign(spAuth(), { clientId: p.clientId, access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 }));
    return { p, msg: "Spotify connected", ok: true };
  }
  let spRefreshing = null;
  async function spToken(force) {
    const a = spAuth();
    if (!a.access && !a.refresh) throw spErr("auth", "Connect Spotify first (Games screen)");
    if (!force && a.access && a.exp > Date.now() + 60000) return a.access;
    if (!a.refresh) throw spErr("auth", "Connect Spotify again (Games screen)");
    if (!spRefreshing) spRefreshing = (async () => {
      let r, j = {};
      try {
        r = await fetch("https://accounts.spotify.com/api/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: a.refresh, client_id: a.clientId || spClientId() }) });
        j = await r.json().catch(() => ({}));
      } catch (e) { throw spErr("net", "Can't reach Spotify. Check the wifi"); }
      if (!r.ok || !j.access_token) {
        if (r.status === 400 || r.status === 401) spSet(SP_AUTH_KEY, { clientId: a.clientId, device: a.device });
        throw spErr("auth", "Spotify logged out. Connect again on the Games screen");
      }
      spSet(SP_AUTH_KEY, Object.assign(spAuth(), { access: j.access_token, refresh: j.refresh_token || a.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000 }));
      return j.access_token;
    })().finally(() => { spRefreshing = null; });
    return spRefreshing;
  }
  async function spApi(method, path, body, retried) {
    const tok = await spToken();
    let r;
    try {
      r = await fetch("https://api.spotify.com/v1" + path, { method,
        headers: Object.assign({ Authorization: "Bearer " + tok }, body ? { "Content-Type": "application/json" } : {}),
        body: body ? JSON.stringify(body) : undefined });
    } catch (e) { throw spErr("net", "Can't reach Spotify. Check the wifi"); }
    if (r.status === 401 && !retried) { await spToken(true); return spApi(method, path, body, true); }
    const text = await r.text().catch(() => "");
    let j = null; try { j = text ? JSON.parse(text) : null; } catch (e) { /* empty body */ }
    if (!r.ok) {
      const er = (j && j.error) || {};
      if (r.status === 404 || er.reason === "NO_ACTIVE_DEVICE") throw spErr("device", "Spotify isn't ready. Open the Spotify app on the iPad, play any song for a second, then come back and try again");
      if (r.status === 403) throw spErr("premium", er.message || "Spotify said no. This needs Spotify Premium");
      if (r.status === 429) throw spErr("rate", "Spotify says slow down. Wait a few seconds and try again");
      throw spErr("api", er.message || ("Spotify error " + r.status));
    }
    return j;
  }

  // Devices: the Spotify app on the iPad (or a phone or speaker) that actually plays the sound.
  let spDeviceList = [], spDevAt = 0, spDevMsg = "";
  async function spDevices() {
    const j = await spApi("GET", "/me/player/devices");
    spDeviceList = ((j && j.devices) || []).filter(d => d.id && !d.is_restricted);
    spDevAt = Date.now();
    return spDeviceList;
  }
  function spPickDevice(list) {
    const saved = spAuth().device;
    return list.find(d => d.id === saved) || list.find(d => d.is_active) || list.find(d => /tablet/i.test(d.type)) || list.find(d => /smartphone/i.test(d.type)) || list[0] || null;
  }

  // Finding each tune on Spotify: search title + film/artist, prefer the original over remixes and covers.
  const SP_BAD = /\b(remix|lo-?fi|slowed|reverb|cover|karaoke|instrumental|reprise|unplugged|mashup|8d|sped|live|acoustic|female|recreated|mix)\b/i;
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  function spTracks() { return spGet(SP_TRACKS_KEY(S.mode)) || {}; }
  async function spFind(q) {
    let items = [];
    for (const term of [`${q.a} ${q.src || ""}`.trim(), q.a]) {
      const j = await spApi("GET", "/search?" + new URLSearchParams({ q: term, type: "track", limit: "10", market: "from_token" }).toString());
      items = (j && j.tracks && j.tracks.items) || [];
      if (items.length) break;
    }
    const t = norm(q.a), src = norm(q.src);
    const score = (it, i) => {
      const n = norm(it.name), al = norm(it.album && it.album.name), ar = norm((it.artists || []).map(a => a.name).join(" "));
      let s = -i * 0.1;
      if (n === t) s += 6; else if (n.includes(t)) s += 4; else if (n.length > 3 && t.includes(n)) s += 2;
      if (src && (al.includes(src) || ar.includes(src))) s += 3;
      if (SP_BAD.test(it.name) || SP_BAD.test((it.album && it.album.name) || "")) s -= 5;
      return s;
    };
    return items.map((it, i) => ({ it, s: score(it, i) })).sort((a, b) => b.s - a.s).slice(0, 5)
      .map(x => ({ uri: x.it.uri, name: x.it.name, artist: (x.it.artists || []).map(a => a.name).join(", ") }));
  }
  async function spResolve(q, next) {
    const cache = spTracks();
    let c = cache[q.id];
    if (!c || !c.list || !c.list.length) {
      const list = await spFind(q);
      if (!list.length) throw spErr("notfound", "Couldn't find this song on Spotify. Play it from your phone instead");
      c = { list, i: 0 };
    }
    if (next) c.i = (c.i + 1) % c.list.length;
    cache[q.id] = c; spSet(SP_TRACKS_KEY(S.mode), cache);
    return c.list[c.i];
  }

  // Playing: intro = 5 seconds then pause; song = up to 30 seconds after the reveal.
  const clip = { q: null, phase: null, end: 0, ms: 0, t: null, int: null, err: "", errQ: null, gen: 0 };
  function clipClear() { clearTimeout(clip.t); clearInterval(clip.int); clip.t = null; clip.int = null; }
  async function spPause() {
    const d = spAuth().device;
    try { await spApi("PUT", "/me/player/pause" + (d ? "?device_id=" + encodeURIComponent(d) : "")); } catch (e) { /* already paused */ }
  }
  function stopClip() {
    const playing = clip.phase === "intro" || clip.phase === "song";
    clipClear(); clip.gen++; clip.q = null; clip.phase = null;
    if (playing) spPause();
  }
  function rerenderTune() { if (S && S.screen === "game:tunes") render(); }
  function tickClip() {
    const ms = Math.max(0, clip.end - Date.now());
    const el = $("cliptimer"), bar = $("clipbar");
    if (el) el.textContent = Math.ceil(ms / 1000);
    if (bar) bar.style.width = (ms / clip.ms * 100) + "%";
  }
  async function spPlay(q, opts) {
    clipClear();
    const gen = ++clip.gen;
    clip.q = q.id; clip.phase = "loading"; clip.err = ""; clip.errQ = null;
    rerenderTune();
    try {
      const track = await spResolve(q, opts.next);
      const dev = spPickDevice(await spDevices());
      if (!dev) throw spErr("device", "Spotify isn't ready. Open the Spotify app on the iPad, play any song for a second, then come back and try again");
      spSet(SP_AUTH_KEY, Object.assign(spAuth(), { device: dev.id }));
      if (gen !== clip.gen) return;
      await spApi("PUT", "/me/player/play?device_id=" + encodeURIComponent(dev.id), { uris: [track.uri], position_ms: 0 });
      if (gen !== clip.gen) { spPause(); return; }
      clip.phase = opts.song ? "song" : "intro"; clip.ms = opts.ms; clip.end = Date.now() + opts.ms;
      rerenderTune();
      clip.int = setInterval(tickClip, 100);
      clip.t = setTimeout(async () => {
        if (gen !== clip.gen) return;
        clipClear(); clip.phase = null; clip.q = null;
        await spPause();
        if (opts.then) opts.then();
        rerenderTune();
      }, opts.ms);
    } catch (e) {
      if (gen !== clip.gen) return;
      clip.phase = null; clip.q = null; clip.err = e.message || "Spotify didn't play"; clip.errQ = q.id;
      rerenderTune();
    }
  }
  // how: "first" = from the ready card, "replay" = again while the clock runs, "next" = another version, clock restarts.
  function playIntro(q, how) {
    const restart = how !== "replay";
    if (restart) stopTimer();
    spPlay(q, { ms: CLIP_MS, next: how === "next", then: restart ? () => {
      if (!S || q.id in S.done || S.revealed[q.id]) return;
      S.started[q.id] = true; save();
      startTimer(q.id);
    } : null });
  }

  // UI pieces for the tune card.
  function spErrBox(q) {
    return clip.err && clip.errQ === q.id ? `<div class="sperr">${esc(clip.err)}</div>` : "";
  }
  function spListening(q) {
    if (clip.q !== q.id) return "";
    if (clip.phase === "loading") return `<div class="cliprow"><span class="spin" aria-hidden="true"></span><strong>Getting the song from Spotify…</strong></div>`;
    if (clip.phase === "intro" || clip.phase === "song") {
      const ms = Math.max(0, clip.end - Date.now());
      return `<div class="cliprow"><div class="timer clip" id="cliptimer">${Math.ceil(ms / 1000)}</div>
        <div class="tbar green"><i id="clipbar" style="width:${ms / clip.ms * 100}%"></i></div>
        <button class="btn small" data-act="sp-stop">Stop</button></div>`;
    }
    return "";
  }
  // While the clock runs: buttons sit next to Reveal. The playing bar and any error get their own line.
  function spButtons(q) {
    if (!spConnected() || (clip.q === q.id && clip.phase)) return "";
    return `<span class="spacer"></span><button class="btn small" data-act="sp-intro" data-id="${q.id}">Replay intro</button>
      <button class="btn small" data-act="sp-next" data-id="${q.id}">Wrong song? Try another version</button>`;
  }
  function spTuneControls(q, shown) {
    if (!spConnected()) return "";
    const busy = clip.q === q.id && !!clip.phase;
    if (!shown) return busy || (clip.err && clip.errQ === q.id) ? `${busy ? `<div class="row">${spListening(q)}</div>` : ""}${spErrBox(q)}` : "";
    return `<div class="row">${spListening(q)}${busy ? "" : `<button class="btn green" data-act="sp-song" data-id="${q.id}">Play the song</button>
      <button class="btn small" data-act="sp-song-next" data-id="${q.id}">Wrong version? Try another</button>`}</div>${spErrBox(q)}`;
  }

  // Hub card: one-time setup, device picker, song check.
  function spCard() {
    const id = spClientId(), on = spConnected();
    let body;
    if (!id) {
      body = `<p style="margin:0">Play Name the Tune straight from Spotify. The sound comes from the Spotify app on this iPad, so it goes to the TV. Needs Spotify Premium.</p>
        <ol class="rules"><li>On developer.spotify.com/dashboard, create an app and tick <strong>Web API</strong>.</li>
          <li>Add this redirect URI to the app: <span class="spcode">${esc(SP_REDIRECT)}</span></li>
          <li>Paste the app's Client ID here.</li></ol>
        <div class="row"><input type="text" id="sp-client" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:220px">
          <button class="btn pink" data-act="sp-save-id">Save</button></div>`;
    } else if (!on) {
      body = `<p style="margin:0">Plays Name the Tune intros through the Spotify app on this iPad, so the sound goes to the TV. Open Spotify on the iPad once before you start.</p>
        <div class="row"><button class="btn big green" data-act="sp-login">Connect Spotify</button>${SPOTIFY_CLIENT_ID ? "" : '<span class="spacer"></span><button class="btn small" data-act="sp-clear-id">Change Client ID</button>'}</div>`;
    } else {
      const dev = spPickDevice(spDeviceList);
      const opts = spDeviceList.map(d => `<option value="${esc(d.id)}"${dev && d.id === dev.id ? " selected" : ""}>${esc(d.name)} (${esc(d.type)})</option>`).join("");
      body = `<p style="margin:0">Name the Tune plays from Spotify. Keep the Spotify app open in the background on the device below.</p>
        <div class="row"><label for="sp-device" style="font-weight:800">Play on</label>
          <select id="sp-device"${spDeviceList.length ? "" : " disabled"}>${opts || "<option>No devices yet</option>"}</select>
          <button class="btn small" data-act="sp-devices">Refresh</button></div>
        <p class="muted" id="sp-dev-msg" style="margin:0">${esc(spDevMsg || (spDeviceList.length ? "" : "Open the Spotify app on the iPad, play any song for a second, then tap Refresh."))}</p>
        <div class="row"><button class="btn" data-act="sp-check">Check songs</button><span class="spacer"></span><button class="btn small" data-act="sp-logout">Disconnect</button></div>
        <div id="sp-check-out" class="muted"></div>`;
    }
    return `<div class="card spcard"><div class="row"><h3>Spotify</h3><span class="spacer"></span><span class="chip${on ? " ok" : ""}">${on ? "Connected" : "Not connected"}</span></div>${body}</div>`;
  }
  function refreshSpCard() {
    const card = document.querySelector(".spcard");
    if (card && S && S.screen === "hub") card.outerHTML = spCard(); else render();
  }
  async function spHubRefresh(force) {
    if (!spConnected() || !S || S.screen !== "hub") return;
    if (!force && Date.now() - spDevAt < 15000) return;
    try { await spDevices(); spDevMsg = ""; }
    catch (e) { spDevMsg = e.message; spDevAt = Date.now(); }
    if (S && S.screen === "hub") refreshSpCard();
  }
  async function spCheckSongs() {
    const out = $("sp-check-out");
    const qs = gameQs("tunes");
    if (out) out.textContent = "Checking " + qs.length + " songs…";
    const lines = []; let found = 0;
    for (let i = 0; i < qs.length; i++) {
      try {
        const t = await spResolve(qs[i]);
        found++;
        lines.push(S.mode === "party" ? `#${i + 1} found` : `#${i + 1} ${esc(qs[i].a)}: ${esc(t.name)} · ${esc(t.artist)}`);
      } catch (e) {
        if (e.code === "auth" || e.code === "net") { if (out) out.textContent = e.message; return; }
        lines.push(`#${i + 1} not found, play it from your phone`);
      }
    }
    const o = $("sp-check-out");
    if (o) o.innerHTML = `<strong>Found ${found} of ${qs.length}.</strong><br>${lines.join("<br>")}`;
  }

  // ---------- this or that ----------
  function viewThisThat() {
    const qs = gameQs("thisthat");
    if (!qs.length) return `<p>No questions here yet.</p>`;
    let i = Math.min(Math.max(0, S.cursor.thisthat || 0), qs.length - 1);
    const q = qs[i];
    const pts = pointsFor("thisthat", q);
    const done = q.id in S.done;
    const picks = S.picks[q.id] || S.teams.map(() => null);
    const optCls = k => done ? (q.correct === k ? " right" : " wrong") : "";
    const rows = S.teams.map((t, ti) => {
      const p = picks[ti];
      const res = done ? (p === q.correct ? `<span class="res" style="color:var(--teal)">+${pts}</span>` : `<span class="res muted">${p ? "0" : "No pick"}</span>`) : "";
      return `<div class="pickrow" style="--c:${t.color}"><span class="tn"><i></i>${esc(t.name)}</span>
        <button class="btn small pickbtn" data-act="pick" data-id="${q.id}" data-i="${ti}" data-k="a" aria-pressed="${p === "a"}"${done ? " disabled" : ""}>A</button>
        <button class="btn small pickbtn" data-act="pick" data-id="${q.id}" data-i="${ti}" data-k="b" aria-pressed="${p === "b"}"${done ? " disabled" : ""}>B</button>${res}</div>`;
    }).join("");
    const allDone = playedCount("thisthat") === qs.length;
    return `<div class="qview">
      <div class="row"><h1 class="h-display" style="font-size:2rem">This or That</h1><span class="spacer"></span>
        <span style="font-weight:800">${i + 1} of ${qs.length}</span>${levelChip(q, pts)}
        <button class="btn small" data-act="go" data-to="hub">All games</button></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="tt"><div class="opt${optCls("a")}"><span class="letter">A</span>${esc(q.a)}</div><div class="opt${optCls("b")}"><span class="letter">B</span>${esc(q.b)}</div></div>
      ${done && q.note ? `<div class="answer" style="font-size:1.4rem">${esc(q.note)}</div>` : ""}
      <div class="picks">${rows}</div>
      ${done ? "" : `<div class="row"><button class="btn big pink" data-act="tt-reveal" data-id="${q.id}">Reveal answer</button><span class="muted">Every team that picked right gets ${pts}.</span></div>`}
      <div class="row"><button class="btn small" data-act="step" data-g="thisthat" data-d="-1"${i === 0 ? " disabled" : ""}>Previous</button>${done ? feedbackBox(q) : '<span class="spacer"></span>'}
        ${allDone ? `<button class="btn big ink" data-act="go" data-to="hub">Done, back to games</button>` : `<button class="btn ${done ? "big ink" : "small"}" data-act="step" data-g="thisthat" data-d="1"${nextOpen("thisthat", i) < 0 ? " disabled" : ""}>${done ? "Next question" : "Skip for now"}</button>`}</div>
    </div>`;
  }

  // ---------- results ----------
  function viewResults() {
    const games = GAMES.filter(g => S.selected[g.id]);
    const tot = totals();
    const max = Math.max(...tot);
    const winners = S.teams.map((t, i) => i).filter(i => tot[i] === max);
    const anyPoints = max > 0;
    let head = "";
    if (anyPoints) {
      const w = winners.map(i => S.teams[i]);
      head = `<div class="winner"><div class="crown">${winners.length > 1 ? "It's a tie" : "Tonight's champions"}</div>
        ${w.map(t => `<div class="tname" style="--c:${t.color}">${esc(t.name)}</div><div class="members-line">${t.members.map(esc).join(", ")}</div>`).join("")}
        <div class="chip" style="font-size:1.2rem;padding:6px 16px">${max} points</div></div>`;
    } else {
      head = `<div class="winner"><div class="crown">No points yet</div><p class="lead">Play a game and the scores show up here.</p></div>`;
    }
    const rows = games.map(g => {
      const sc = S.teams.map((t, i) => gameScore(g.id, i));
      const gm = Math.max(...sc);
      return `<tr><td><strong>${g.name}</strong> <span class="muted">${playedCount(g.id)}/${gameQs(g.id).length}</span></td>${sc.map(v => `<td class="${gm > 0 && v === gm ? "best" : ""}">${v}</td>`).join("")}</tr>`;
    }).join("");
    return `<div class="row"><h1 class="h-display" style="font-size:2.2rem">Scoreboard</h1><span class="spacer"></span>
      <button class="btn small" data-act="go" data-to="hub">Back to games</button>${anyPoints ? '<button class="btn pink" data-act="confetti">Celebrate</button>' : ""}</div>
      ${head}
      <div class="table-wrap"><table class="scores"><thead><tr><th>Game</th>${S.teams.map(t => `<th style="box-shadow:inset 0 -6px 0 ${t.color}">${esc(t.name)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td>Total</td>${tot.map(v => `<td>${v}</td>`).join("")}</tr></tfoot></table></div>
      <p class="muted" style="margin-top:12px">A star marks who won each game.</p>`;
  }

  // ---------- feedback ----------
  function feedbackLines() {
    const all = GAMES.flatMap(g => gameQs(g.id).map(q => ({ g, q })));
    return all.filter(x => S.feedback[x.q.id]).map(x => {
      const qtxt = x.g.id === "thisthat" ? `${x.q.q} (${x.q.a} vs ${x.q.b})` : x.g.id === "tunes" ? `${x.q.a} (${x.q.q})` : x.q.q;
      return { v: S.feedback[x.q.id], game: x.g.name, level: LEVEL_LABEL[x.q.level], text: qtxt, cat: x.q.cat };
    });
  }
  function feedbackText() {
    const lines = feedbackLines();
    const up = lines.filter(l => l.v === "up"), down = lines.filter(l => l.v === "down");
    const fmt = l => `- ${l.game}${l.cat ? " / " + l.cat : ""} (${l.level}): ${l.text}`;
    let out = "Game night practice feedback\n\nLiked:\n" + (up.map(fmt).join("\n") || "- none") + "\n\nDidn't like:\n" + (down.map(fmt).join("\n") || "- none");
    if (S.notes.trim()) out += "\n\nNotes:\n" + S.notes.trim();
    return out;
  }
  function viewFeedback() {
    const lines = feedbackLines();
    return `<div class="row"><div><h1 class="h-display" style="font-size:2.2rem">Your feedback</h1>
      <p class="lead">${lines.length} questions rated. Copy this and paste it to Claude, and the real questions will follow what you liked.</p></div>
      <span class="spacer"></span><button class="btn big pink" data-act="copy-fb">Copy feedback</button></div>
      <div class="two-col">
        <div class="card"><div class="fblist">${lines.map(l => `<div class="fbitem"><span class="v ${l.v}">${l.v === "up" ? "Keep" : "Drop"}</span><span><strong>${l.game}</strong> · ${l.level}<br>${esc(l.text)}</span></div>`).join("") || '<p class="muted">Nothing rated yet. Use the thumbs after each answer.</p>'}</div></div>
        <div class="card stack"><label for="fb-notes" style="font-weight:800">Anything else?</label>
          <textarea id="fb-notes" placeholder="Too easy, more cricket, fewer old movies, add questions about us...">${esc(S.notes)}</textarea>
          <textarea id="fb-out" readonly hidden aria-label="Feedback text to copy"></textarea></div>
      </div>`;
  }

  // ---------- actions ----------
  function stopAll() { stopTimer(); stopClip(); }
  function go(to) {
    stopAll();
    if (to === "teams") { syncTeamsWithPlayers(); lastLanded = null; }
    if (to === "game:jeopardy") S.openQ = null;
    if (to === "results" && S.screen !== "results") setTimeout(() => { if (totals().some(v => v > 0)) celebrate(true); }, 150);
    S.screen = to;
    save(); render();
  }
  function award(game, qid, ti) {
    const q = qById(game, qid); if (!q || qid in S.done) return;
    const pts = pointsFor(game, q);
    const deltas = S.teams.map((t, i) => (i === ti ? pts : 0));
    applyAward(game, qid, deltas, ti >= 0 ? `${pts} to ${S.teams[ti].name}` : "nobody scored");
    if (game === "literal") {
      const j = nextOpen(game, S.cursor[game] || 0);
      if (j >= 0) S.cursor[game] = j;
      save();
      toast(ti >= 0 ? `+${pts} ${S.teams[ti].name}` : "Nobody got it");
    }
    if (ti >= 0) celebrate(false);
    checkGameOver(game);
    render();
  }
  function mark(game, qid, ok) {
    const q = qById(game, qid); if (!q || qid in S.done) return;
    stopAll();
    const pts = livePoints(game, q);
    const ti = turnTeam(game);
    const name = S.teams[ti].name;
    const deltas = S.teams.map((t, i) => (ok && i === ti ? pts : 0));
    applyAward(game, qid, deltas, ok ? `${pts} to ${name}` : `${name} missed`, { turnBefore: S.turn[game] });
    S.turn[game] = (ti + 1) % S.teams.length;
    if (game === "jeopardy") S.openQ = null;
    else { const j = nextOpen(game, S.cursor[game] || 0); if (j >= 0) S.cursor[game] = j; }
    save();
    toast(ok ? `+${pts} ${name}` : `${name} missed it`);
    if (ok) celebrate(false);
    else if (!S.timedOut[qid]) drinkMiss(ti);   // a timeout already called the whole-team sip
    checkGameOver(game);
    render();
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    switch (a) {
      case "home": stopAll(); clearDrinks(); S = null; render(); break;
      case "drink-ok": showDrink(); break;
      case "sp-save-id": {
        const v = ($("sp-client").value || "").trim();
        if (!/^[A-Za-z0-9]{20,64}$/.test(v)) { toast("That doesn't look like a Client ID"); return; }
        spSet(SP_AUTH_KEY, Object.assign(spAuth(), { clientId: v })); refreshSpCard(); break;
      }
      case "sp-clear-id": spSet(SP_AUTH_KEY, null); refreshSpCard(); break;
      case "sp-login": spLogin(); break;
      case "sp-logout": stopClip(); spSet(SP_AUTH_KEY, SPOTIFY_CLIENT_ID ? null : { clientId: spAuth().clientId }); spDeviceList = []; spDevAt = 0; refreshSpCard(); toast("Spotify disconnected"); break;
      case "sp-devices": spHubRefresh(true); break;
      case "sp-check": spCheckSongs(); break;
      case "sp-intro-first": case "sp-intro": case "sp-next": {
        const q = qById("tunes", b.dataset.id); if (!q) return;
        playIntro(q, a === "sp-intro-first" ? "first" : a === "sp-next" ? "next" : "replay"); break;
      }
      case "sp-song": case "sp-song-next": {
        const q = qById("tunes", b.dataset.id); if (!q) return;
        spPlay(q, { ms: SONG_MS, song: true, next: a === "sp-song-next" }); break;
      }
      case "sp-stop": stopClip(); rerenderTune(); break;
      case "toggle-drinks": S.drinks = !S.drinks; if (!S.drinks) clearDrinks(); save(); render(); break;
      case "shot": {
        const id = b.dataset.id;
        if (id in S.done) return;
        const sq = qById("jeopardy", id);
        if (b.dataset.v !== "take" && !shotCanPass(sq)) return;
        S.shotBy[id] = turnTeam("jeopardy");
        S.shotChoice[id] = b.dataset.v === "take" ? "take" : "pass";
        save();
        if (S.shotChoice[id] === "take") { celebrate(true); toast("Double points"); }
        render(); break;
      }
      case "new": {
        const m = b.dataset.mode;
        if (m === "party" && !BANKS.party) return;
        const prev = load(m);
        S = fresh(m);
        if (prev && prev.players) S.players = prev.players.slice();
        save(); render(); break;
      }
      case "resume": S = load(b.dataset.mode) || fresh(b.dataset.mode); clearDrinks(); render(); break;
      case "go": go(b.dataset.to); break;
      case "undo": stopAll(); clearDrinks(); undo(); break;
      case "rm-player": S.players.splice(Number(b.dataset.i), 1); syncTeamsWithPlayers(); save(); render(); break;
      case "add-player": {
        const n = cleanName($("add-name").value);
        if (!n) return;
        if (S.players.some(p => p.toLowerCase() === n.toLowerCase())) { toast(n + " is already on the list"); return; }
        S.players.push(n); save(); render();
        setTimeout(() => { const f = $("add-name"); if (f) f.focus(); }, 0);
        break;
      }
      case "paste-players":
      case "replace-players": {
        const names = $("paste-names").value.split(/[\n,;\t]+/).map(cleanName).filter(Boolean);
        if (!names.length) { toast("Paste some names first"); return; }
        if (a === "replace-players") S.players = [];
        let added = 0;
        names.forEach(n => { if (!S.players.some(p => p.toLowerCase() === n.toLowerCase())) { S.players.push(n); added++; } });
        syncTeamsWithPlayers(); save(); render(); toast(`Added ${added} ${added === 1 ? "name" : "names"}`);
        break;
      }
      case "reset-players": S.players = DEFAULT_PLAYERS.slice(); syncTeamsWithPlayers(); save(); render(); break;
      case "team-count": setTeamCount(Number(b.dataset.n)); lastLanded = null; render(); break;
      case "spin": spin(); break;
      case "fill": fillRest(); break;
      case "clear-teams": S.teams.forEach(t => { t.members = []; }); lastLanded = null; save(); render(); break;
      case "move": {
        const from = Number(b.dataset.i), name = b.dataset.name;
        const to = (from + 1) % S.teams.length;
        S.teams[from].members = S.teams[from].members.filter(m => m !== name);
        S.teams[to].members.push(name);
        save(); render(); break;
      }
      case "toggle-game": S.selected[b.dataset.g] = !S.selected[b.dataset.g]; save(); render(); break;
      case "open": S.openQ = b.dataset.id; save(); render(); break;
      case "close-q": S.openQ = null; save(); render(); break;
      case "reveal": if (timer.q === b.dataset.id) stopTimer(); S.revealed[b.dataset.id] = true; save(); render(); break;
      case "mark": mark(b.dataset.g, b.dataset.id, b.dataset.ok === "1"); break;
      case "turn-next": S.turn[b.dataset.g] = (turnTeam(b.dataset.g) + 1) % S.teams.length; save(); render(); break;
      case "lit-start": S.started[b.dataset.id] = true; save(); startTimer(b.dataset.id); render(); break;
      case "lit-restart": startTimer(b.dataset.id); render(); break;
      case "award": award(b.dataset.g, b.dataset.id, Number(b.dataset.i)); break;
      case "step": {
        stopAll();
        const g = b.dataset.g, n = gameQs(g).length, cur = S.cursor[g] || 0;
        if (Number(b.dataset.d) > 0) { const j = nextOpen(g, cur); if (j >= 0) S.cursor[g] = j; }
        else S.cursor[g] = Math.max(0, cur - 1);
        save(); render(); break;
      }
      case "pick": {
        const id = b.dataset.id, ti = Number(b.dataset.i), k = b.dataset.k;
        if (id in S.done) return;
        const p = S.picks[id] || S.teams.map(() => null);
        p[ti] = p[ti] === k ? null : k;
        S.picks[id] = p; save(); render(); break;
      }
      case "tt-reveal": {
        const q = qById("thisthat", b.dataset.id); if (!q || q.id in S.done) return;
        const pts = pointsFor("thisthat", q);
        const p = S.picks[q.id] || S.teams.map(() => null);
        S.picks[q.id] = p;
        const deltas = S.teams.map((t, i) => (p[i] === q.correct ? pts : 0));
        const winners = S.teams.filter((t, i) => deltas[i] > 0).map(t => t.name);
        applyAward("thisthat", q.id, deltas, winners.length ? `${pts} to ${winners.join(", ")}` : "nobody scored");
        if (winners.length) celebrate(false);
        drinkWrongPicks(S.teams.map((t, i) => i).filter(i => p[i] && p[i] !== q.correct));
        checkGameOver("thisthat");
        render(); break;
      }
      case "fb": {
        const id = b.dataset.id, v = b.dataset.v;
        S.feedback[id] = S.feedback[id] === v ? undefined : v;
        if (!S.feedback[id]) delete S.feedback[id];
        save();
        document.querySelectorAll(`[data-act="fb"][data-id="${id}"]`).forEach(x => x.setAttribute("aria-pressed", String(S.feedback[id] === x.dataset.v)));
        break;
      }
      case "copy-fb": {
        const text = feedbackText();
        const out = $("fb-out");
        const fallback = () => { out.value = text; out.hidden = false; out.focus(); out.select(); toast("Select the text and copy it"); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Feedback copied"), fallback);
        else fallback();
        break;
      }
      case "confetti": celebrate(true); break;
    }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "sp-device") { spSet(SP_AUTH_KEY, Object.assign(spAuth(), { device: e.target.value })); toast("Spotify will play on " + e.target.selectedOptions[0].textContent); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset && t.dataset.act === "team-name") {
      S.teams[Number(t.dataset.i)].name = t.value.slice(0, 24) || TEAM_DEFAULTS[Number(t.dataset.i)].name;
      save();
    } else if (t.id === "fb-notes") { S.notes = t.value.slice(0, 2000); save(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("drink").hidden) { e.preventDefault(); showDrink(); return; }
    if (e.key === "Enter" && e.target.id === "add-name") { e.preventDefault(); document.querySelector('[data-act="add-player"]').click(); }
  });
  window.addEventListener("resize", () => { if (S && S.screen === "teams") drawWheel(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S && S.screen === "teams") drawWheel(); });

  render();
  spHandleReturn().then(res => {
    if (!res) return;
    if (res.p && res.p.mode) { const v = load(res.p.mode); if (v) { S = v; if (res.p.screen) S.screen = res.p.screen; } }
    render(); toast(res.msg);
  });
})();
</script>
</body>
</html>
